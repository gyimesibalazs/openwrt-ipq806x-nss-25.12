name: Build ipq806x NSS images

on:
  push:
    branches:
      - 'ipq806x-nss-*'
    tags:
      - 'v*'
    paths-ignore:
      - 'README.md'
      - 'README.openwrt.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.device }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - device: tplink_c2600
            seed: diff-c2600
          - device: netgear_r7800
            seed: diff
          - device: netgear_r7500v2
            seed: diff-r7500v2

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force >/dev/null || true
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools python3-dev rsync swig unzip zlib1g-dev file \
            wget zstd

      # getver.sh counts commits since the OpenWrt "reboot", so the full
      # history is needed for a correct rXXXXX revision
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache downloads
        uses: actions/cache@v4
        with:
          path: dl
          key: dl-${{ matrix.device }}-${{ hashFiles('feeds.conf.default', matrix.seed) }}
          restore-keys: dl-${{ matrix.device }}-

      - name: Update feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          unzip -o VHTNSS.zip

      - name: Configure
        run: |
          cp ${{ matrix.seed }} .config
          make defconfig

      - name: Download sources
        run: make -j8 download

      - name: Build
        run: |
          make -j$(nproc) || {
            echo "::warning::parallel build failed, rerunning with -j1 V=s"
            make -j1 V=s 2>&1 | tail -n 300
            exit 1
          }

      - name: Collect images
        run: |
          mkdir -p out
          cp bin/targets/ipq806x/generic/openwrt-nss-*-${{ matrix.device }}-* out/
          cp bin/targets/ipq806x/generic/openwrt-nss-*-${{ matrix.device }}.manifest out/
          (cd out && sha256sum * > sha256sums-${{ matrix.device }})
          ls -la out

      - name: Upload images
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-nss-${{ matrix.device }}
          path: out/
          retention-days: 30

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download images
        uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" out/* \
            --repo "${{ github.repository }}" \
            --title "OpenWrt NSS ${{ github.ref_name }}" \
            --notes "Images for the TP-Link Archer C2600 (tested) and the Netgear R7800 (not yet tested on hardware). See the README for details and test results."
